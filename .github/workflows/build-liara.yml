name: Build for Liara

# ساخت برنامه روی GitHub (سریع) و انتشار بسته آماده در شاخه liara-deploy.
# لیارا به شاخه liara-deploy وصل است و فقط بسته آماده را اجرا می‌کند (بدون نصب و build).

on:
  push:
    branches: [claude/jihad-nasr-sports-club-site-y6p5ez, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-liara
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build package
        env:
          DATABASE_URL: file:/tmp/build.db
        run: ./scripts/build-deploy.sh

      - name: Smoke test on node:22-alpine (same as Liara)
        run: |
          docker build -t smoke-image dist
          docker run -d --name smoke -p 3000:3000 smoke-image
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then break; fi
            sleep 2
          done
          docker logs smoke
          for p in / /login /sports /services /schedule /news; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || { echo "::error::$p returned $code"; exit 1; }
          done
          docker rm -f smoke

      - name: Publish to liara-deploy branch
        run: |
          cd dist
          git init -q -b liara-deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" liara-deploy
